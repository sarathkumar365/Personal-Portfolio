<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How I Build Software Mockup</title>
    <style>
      :root {
        --ink: #111;
        --paper: #f7f7f2;
        --paper-soft: #fbfaf6;
        --line: rgba(0, 0, 0, 0.22);
        --accent: #0b7285;
        --accent-soft: rgba(11, 114, 133, 0.15);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 10%, rgba(0,0,0,0.06), transparent 55%), var(--paper);
        color: var(--ink);
        font-family: "Courier Prime", "Courier New", monospace;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .frame {
        width: min(100%, 812px);
        min-height: 420px;
        border: 1.5px solid var(--line);
        background: linear-gradient(180deg, rgba(0,0,0,0.02), transparent 30%), var(--paper-soft);
        box-shadow: 0 20px 44px -24px rgba(0,0,0,0.3), inset 0 0 0 1px rgba(255,255,255,0.6);
        padding: 20px;
      }
      .left { position: relative; }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .32em;
        opacity: .65;
        margin: 0 0 8px;
      }
      .title {
        margin: 0 0 14px;
        font-size: 30px;
        letter-spacing: -0.01em;
        font-family: Georgia, "Times New Roman", serif;
      }
      .map {
        position: relative;
        height: 560px;
        border: 1px dashed rgba(0,0,0,0.18);
        background: rgba(255,255,255,0.3);
        overflow: hidden;
      }
      svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .path {
        fill: none;
        stroke: rgba(0,0,0,0.58);
        stroke-width: 2.2;
        stroke-dasharray: 3.5 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .path-guide {
        fill: none;
        stroke: rgba(0,0,0,0.14);
        stroke-width: 1.1;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .milestone {
        position: absolute;
        transform: translate(-50%, -50%);
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
        width: 0;
        height: 0;
        overflow: visible;
      }
      .dot {
        position: absolute;
        left: 0;
        top: 0;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        border: 1.5px solid rgba(0,0,0,0.75);
        background: #fff;
        box-shadow: 0 0 0 6px transparent;
        transition: .18s ease;
        transform: translate(-50%, -50%);
      }
      .label {
        position: absolute;
        font-size: 11px;
        letter-spacing: .22em;
        text-transform: uppercase;
        white-space: nowrap;
        text-align: center;
        line-height: 1;
        background: rgba(247,247,242,0.9);
        border: 1px solid rgba(0,0,0,0.2);
        padding: 4px 6px;
      }
      .label-right { left: 14px; top: -6px; }
      .label-left { right: 14px; top: -6px; }
      .label-top { left: 0; bottom: 14px; transform: translateX(-50%); }
      .label-bottom { left: 0; top: 14px; transform: translateX(-50%); }
      .label-top-right { left: 14px; bottom: 14px; }
      .label-top-left { right: 14px; bottom: 14px; }
      .label-bottom-right { left: 14px; top: 14px; }
      .label-bottom-left { right: 14px; top: 14px; }
      .milestone:hover .dot,
      .milestone.active .dot {
        border-color: var(--accent);
        box-shadow: 0 0 0 6px var(--accent-soft);
      }
      .hover-card {
        position: absolute;
        min-width: 210px;
        max-width: 280px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.9);
        box-shadow: 0 14px 28px -18px rgba(0,0,0,0.45);
        padding: 12px;
        z-index: 10;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity .18s ease, transform .18s ease;
        pointer-events: none;
      }
      .hover-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .hover-card .kicker {
        font-size: 10px;
        letter-spacing: .3em;
        text-transform: uppercase;
        opacity: .65;
      }
      .hover-card h3 {
        margin: 0;
        font-size: 18px;
        font-family: Georgia, "Times New Roman", serif;
      }
      .skills {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pill {
        border: 1px solid rgba(0,0,0,0.28);
        background: rgba(255,255,255,0.8);
        padding: 6px 8px;
        font-size: 10px;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
    </style>
  </head>

          <button class="milestone active" data-key="design" data-side="right" data-t="0.08" aria-label="Design">
            <div class="dot"></div><div class="label label-bottom-right">Design</div>

    <script>
      const model = {
        design: ["System Design", "API Design", "Data Modeling", "Architecture Notes"],
        build: ["React", "TypeScript", "Java", "REST APIs"],
        ship: ["Jenkins", "Harness", "Docker", "CI/CD"],
        observe: ["Datadog", "Logs", "Traces", "Incident Response"],
        improve: ["AI Workflows", "Refactors", "Performance", "Reliability"]
      };

      const map = document.querySelector('.map');
      const routePath = document.getElementById('route-path');
      const hoverCard = document.getElementById('hover-card');
      const heading = document.getElementById('heading');
      const kicker = document.getElementById('kicker');
      const skills = document.getElementById('skills');
      const milestones = Array.from(document.querySelectorAll('.milestone'));

      function positionMilestones() {
        if (!routePath) return;
        const total = routePath.getTotalLength();
        milestones.forEach((node) => {
          const t = Number(node.dataset.t ?? "0");
          const point = routePath.getPointAtLength(total * t);
          const xPct = (point.x / 800) * 100;
          const yPct = (point.y / 600) * 100;
          node.style.left = `${xPct}%`;
          node.style.top = `${yPct}%`;
        });
      }

      function setPhase(key, node) {
        milestones.forEach((node) => node.classList.toggle('active', node.dataset.key === key));
        heading.textContent = key.charAt(0).toUpperCase() + key.slice(1);
        kicker.textContent = 'Delivery Phase';
        skills.innerHTML = model[key].map((item) => `<span class="pill">${item}</span>`).join('');

        if (!node) return;

        const nodeRect = node.getBoundingClientRect();
        const mapRect = map.getBoundingClientRect();
        const side = node.dataset.side === 'left' ? 'left' : 'right';

        const offsetX = side === 'left' ? -228 : 24;
        const top = nodeRect.top - mapRect.top - 8;
        const left = nodeRect.left - mapRect.left + offsetX;

        const clampedLeft = Math.max(10, Math.min(left, mapRect.width - 290));
        const clampedTop = Math.max(10, Math.min(top, mapRect.height - 132));

        hoverCard.style.left = `${clampedLeft}px`;
        hoverCard.style.top = `${clampedTop}px`;
        hoverCard.classList.add('visible');
      }

      function hideCard() {
        hoverCard.classList.remove('visible');
      }

      milestones.forEach((node) => {
        node.addEventListener('mouseenter', () => setPhase(node.dataset.key, node));
        node.addEventListener('focus', () => setPhase(node.dataset.key, node));
        node.addEventListener('click', () => setPhase(node.dataset.key, node));
        node.addEventListener('mouseleave', hideCard);
        node.addEventListener('blur', hideCard);
      });

      map.addEventListener('mouseleave', hideCard);

      positionMilestones();
      window.addEventListener('resize', positionMilestones);

      const initial = milestones[0];
      if (initial) setPhase(initial.dataset.key, initial);
      hideCard();
    </script>
